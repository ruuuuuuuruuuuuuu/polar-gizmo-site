<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>極地的珍道具店</title>
<meta name="description" content="日本では買えない、珍しくて面白い海外製ガジェットの並行輸入ショップ">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<a href="index.html"><img src="images/icon.png" class="icon" /></a>
<nav>
<a href="index.html#items">商品一覧</a>
<a href="guide.html">お買い物ガイド</a>
<a href="about.html">お店情報</a>
<a href="news.html">ニュース</a>
</nav>
</header>

<main>
<section class="hero">
<div class="content">
<img src="images/logo.png" class="logo" />
<div class="hang r">海外ガジェット</div>
</section>
<h2 id="items">取り扱い商品</h2>
<div class="cards" id="cards">
</div>
<p class="note">
  当店の商品は並行輸入品です。メーカー保証の対象外となりますので、ご購入前に<a href="guide.html">お買い物ガイド</a>をご確認ください。
</p>

</div>
</main>

<footer>
<p>
<a href="guide.html">お買い物ガイド</a>
<a href="tokushoho.html">特定商取引法に基づく表記</a>
<a href="about.html">お店情報</a>
</p>
<p>&copy; 極地的珍道具店 / お問い合わせ: staff@polar-gizmo.party</p>
</footer>

<script>
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
fetch('products.json').then(r=>r.json()).then(list=>{
document.getElementById('cards').innerHTML=list.map(p=>{
const c=p.colors[0];
const thumb=c.img?'<div class="pimg"><img src="'+esc(c.img)+'" alt="'+esc(p.name)+'"></div>':'<div class="ph" style="background:'+esc(c.hex)+'"><span>'+esc(p.name)+'（仮画像）</span></div>';
return '<a class="card" href="product.html?id='+encodeURIComponent(p.id)+'">'+thumb+'<div class="t"><b>'+esc(p.name)+'</b><br>'+esc(p.lead)+'<br><span class="pr">&yen;'+p.price.toLocaleString('ja-JP')+'（税込・送料無料）</span> / '+p.colors.length+'色</div></a>';
}).join('');
}).catch(()=>{
document.getElementById('cards').innerHTML='<p>商品データを読み込めませんでした。時間をおいて、もう一度お開きください。</p>';
});
</script>
</body>
</html>
