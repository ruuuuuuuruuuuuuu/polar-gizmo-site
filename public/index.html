<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>極地的珍道具店</title>
<meta name="description" content="日本では買えない、珍しくて面白い海外製ガジェットの並行輸入ショップ">
<link rel="stylesheet" href="style.css">
<script src="site.js"></script>
</head>
<body>

<site-header></site-header>

<main>
<div class="content">

<section class="hero">
<img src="images/logo.png" class="logo" />
</section>

<section class="items">
<h2 id="items"><img src="images/h2-items.png" class="h2-img" /></h2>
<div class="cards" id="cards"></div>
</section>

<section class="textbox">
<p class="note">
当店の商品は並行輸入品です。<br />
中間業者を介さずメーカー公式より仕入れた正規品のみ取り扱っています。<br />
メーカー保証の対象外となりますので、ご購入前に<a href="guide.html">お買い物ガイド</a>をご確認ください。<br />
</p>
</section>

</div>
</main>

<site-footer></site-footer>

<script>
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
fetch('products.json').then(r=>r.json()).then(list=>{
document.getElementById('cards').innerHTML=list.map(p=>{
const c=p.colors[0];
const thumb=c.img?'<div class="pimg"><img src="'+esc(c.img)+'" alt="'+esc(p.name)+'"></div>':'<div class="ph" style="background:'+esc(c.hex)+'"><span>'+esc(p.name)+'（仮画像）</span></div>';
return '<a class="card" href="product.html?id='+encodeURIComponent(p.id)+'">'+thumb+'<div class="t"><b>'+esc(p.name)+'</b><br>'+esc(p.lead)+'<br><span class="pr">&yen;'+p.price.toLocaleString('ja-JP')+'税込・送料無料</span></div></a>';
}).join('');
}).catch(()=>{
document.getElementById('cards').innerHTML='<p>商品データを読み込めませんでした。時間をおいて、もう一度お開きください。</p>';
});
</script>
</body>
</html>
