<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>極地的珍道具店</title>
<meta name="description" content="日本では買えない、珍しくて面白い海外製ガジェットの並行輸入ショップ">
<link rel="icon" href="images/favicons/favicon.ico" sizes="32x32">
<link rel="icon" href="images/favicons/icon-192x192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="images/favicons/apple-touch-icon-180x180.png">
<link rel="manifest" href="images/favicons/manifest.json">
<link rel="stylesheet" href="style.css">
<script src="site.js"></script>
</head>
<body>

<site-header></site-header>

<main>
<div class="content">

<section class="hero">
<img src="images/logo.png" alt="極地的珍道具店" class="logo" />
</section>

<section class="items">
<h2 id="items"><img src="images/h2-newitem.png" alt="新着道具" class="h2-img" /></h2>
<div class="cards" id="cards"></div>
</section>

<section class="textbox">
<p class="note">
当店の商品は並行輸入品です。<br />
中間業者を介さずメーカー公式より仕入れた正規品のみ取り扱っています。<br />
メーカー保証の対象外となりますので、ご購入前に<a href="guide.html">お買い物ガイド</a>をご確認ください。<br />
</p>
</section>

</div>
</main>

<site-footer></site-footer>

<script src="cards.js"></script>
<script>
fetch('products.json').then(r=>r.json()).then(list=>{
document.getElementById('cards').innerHTML=Cards.cards(list);
}).catch(()=>{
document.getElementById('cards').innerHTML='<p>商品データを読み込めませんでした。時間をおいて、もう一度お開きください。</p>';
});
</script>
</body>
</html>
